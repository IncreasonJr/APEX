services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hindsight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.0.18
    container_name: hindsight
    ports:
      - "8888:8888"
      - "9999:9999"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${NVIDIA_API_KEY}
      HINDSIGHT_API_LLM_BASE_URL: https://integrate.api.nvidia.com/v1
      HINDSIGHT_API_LLM_MODEL: meta/llama-4-maverick-17b-128e-instruct
      HINDSIGHT_API_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hindsight
      HINDSIGHT_API_EMBEDDING_PROVIDER: openai
      HINDSIGHT_API_PORT: 8888

volumes:
  postgres_data:
